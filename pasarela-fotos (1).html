<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pasarela de recuerdos</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--cw:max(150px,min(52vw,330px,calc((100vh - 360px)*.75)));--gold:#e8c872;--gold2:#fff1c1;--gold3:#b8893a;--bg:#07060a;--ink:#f6ecd2;--panel:#14111b;--line:rgba(232,200,114,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060a}}
:root[data-theme="dark"]{--bg:#07060a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#241a33 0,#0d0a14 55%,var(--bg) 100%);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden;user-select:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
header{position:relative;z-index:5;text-align:center;padding:22px 12px 0}
h1{margin:0;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:clamp(24px,5vw,48px);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(100deg,var(--gold3) 20%,var(--gold2) 45%,var(--gold) 55%,var(--gold3) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:-250% 0}}
.sub{font-style:italic;font-weight:500;font-size:clamp(18px,3.2vw,30px);color:var(--gold2);margin-top:6px;letter-spacing:.1em;text-shadow:0 0 16px rgba(232,200,114,.7),0 2px 4px #000}
.rule{width:min(320px,60%);height:1px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#stage{position:absolute;left:0;right:0;top:150px;bottom:170px;z-index:2;perspective:1300px;touch-action:pan-y;cursor:grab}
.card{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:3/4;margin:calc(var(--cw)*-.667) 0 0 calc(var(--cw)*-.5);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s,filter .8s;border-radius:6px;padding:9px;background:linear-gradient(135deg,var(--gold2),var(--gold) 30%,var(--gold3) 60%,var(--gold2));box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 40px rgba(232,200,114,.18);-webkit-box-reflect:below 6px linear-gradient(transparent 70%,rgba(255,255,255,.22));will-change:transform}
.card.on{box-shadow:0 25px 60px rgba(0,0,0,.8),0 0 70px rgba(255,225,140,.45)}
.inner{position:relative;width:100%;height:100%;overflow:hidden;border-radius:2px;background:#1b1624}
.inner img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.inner img.bg{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(16px) brightness(.5);z-index:0}
.inner::after{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.card.on .inner::after{animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--gold);font-family:'Cinzel',serif;font-size:13px;letter-spacing:.2em;text-align:center;padding:14px}
.ph b{font-size:44px;font-weight:500}
#cap{position:absolute;left:0;right:0;bottom:78px;z-index:3;text-align:center;padding:0 16px}
#lab{font-family:'Cinzel',serif;font-size:clamp(18px,3.4vw,30px);letter-spacing:.2em;color:var(--gold2);text-shadow:0 0 18px rgba(232,200,114,.6)}
#txt{font-style:italic;font-size:clamp(15px,2.2vw,21px);color:var(--ink);opacity:.8;min-height:1.3em;margin-top:2px}
#dots{position:absolute;left:0;right:0;bottom:30px;z-index:3;display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:0 60px}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(232,200,114,.3);cursor:pointer;transition:.4s}
#dots i.on{background:var(--gold2);box-shadow:0 0 12px var(--gold);transform:scale(1.5)}
.nav{position:absolute;top:50%;z-index:4;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(20,17,27,.6);color:var(--gold);font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}
.nav:hover{box-shadow:0 0 18px var(--gold);color:var(--gold2)}
#prev{left:12px}#next{right:12px}
#master{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(20,17,27,.55);color:var(--gold);font-size:14px;cursor:pointer;opacity:.45;transition:.3s}
#master:hover{opacity:1;box-shadow:0 0 14px var(--gold)}
#play{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:rgba(20,17,27,.55);color:var(--gold);font:12px 'Cinzel',serif;letter-spacing:.1em;cursor:pointer;opacity:.6}
#play:hover{opacity:1}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:20;background:var(--panel);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.open{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
.ph1{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);font-family:'Cinzel',serif;color:var(--gold);letter-spacing:.14em}
.x{background:none;border:0;color:var(--gold);font-size:22px;cursor:pointer}
.pbody{overflow:auto;padding:14px 18px;flex:1}
.pbody label{display:block;font-size:14px;color:var(--gold);margin:8px 0 3px;letter-spacing:.06em}
input[type=text]{width:100%;background:#0c0a12;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;font:16px 'Cormorant Garamond',serif;user-select:text}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#241a08;border:0;border-radius:6px;padding:9px 14px;font:700 12px 'Cinzel',serif;letter-spacing:.1em;cursor:pointer}
.btn.g{background:none;color:var(--gold);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}
.row img{width:62px;height:82px;object-fit:cover;border-radius:4px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts button{background:none;border:1px solid var(--line);color:var(--gold);border-radius:5px;padding:3px 9px;cursor:pointer;font:14px 'Cormorant Garamond',serif}
.acts button:hover{background:rgba(232,200,114,.12)}
.hint{font-size:14px;opacity:.7;margin:10px 0;font-style:italic}
#lb{position:fixed;inset:0;z-index:30;background:rgba(5,4,8,.94);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb.open{display:flex}
.lights{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.lights i{position:absolute;top:-8%;width:36vw;height:115%;background:conic-gradient(from 165deg at 50% 0,transparent 0,rgba(255,235,170,.2) 15deg,transparent 30deg,transparent 360deg);transform-origin:50% 0;animation:sway 9s ease-in-out infinite alternate}
.lights i:nth-child(1){left:-6vw;animation-delay:-2s}.lights i:nth-child(2){left:32vw}.lights i:nth-child(3){right:-6vw;animation-delay:-5s}
@keyframes sway{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.floor{position:fixed;left:0;right:0;bottom:0;height:36vh;z-index:0;pointer-events:none;background:linear-gradient(transparent,rgba(232,200,114,.2)),repeating-linear-gradient(90deg,rgba(232,200,114,.18) 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,rgba(232,200,114,.14) 0 1px,transparent 1px 40px);transform:perspective(260px) rotateX(58deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 55%);mask-image:linear-gradient(transparent,#000 55%)}
.rule{position:relative}.rule::after{content:"◆";position:absolute;left:50%;top:-7px;transform:translateX(-50%);font-size:12px;line-height:1;color:var(--gold2);padding:0 9px;background:#150f1d;text-shadow:0 0 8px var(--gold)}
.sub::before,.sub::after{content:"✦";color:var(--gold);font-size:.7em;margin:0 .7em;vertical-align:middle}
#lab{display:inline-block;padding:5px 30px;border:1px solid var(--gold3);border-radius:40px;background:rgba(20,15,28,.65);box-shadow:0 0 22px rgba(232,200,114,.25),inset 0 0 12px rgba(232,200,114,.12)}
.card::before{content:"";position:absolute;inset:3px;border:1px solid rgba(70,40,5,.6);border-radius:4px;pointer-events:none;z-index:3}
.gem{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:24px;line-height:1;color:var(--gold2);text-shadow:0 0 14px var(--gold);opacity:0;transition:opacity .6s;z-index:4}
.card.on .gem{opacity:1;animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 30px #fff,0 0 10px var(--gold)}}
@keyframes blink{50%{opacity:.25}}
#snd{position:fixed;left:calc(104px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(20,17,27,.55);font-size:14px;cursor:pointer;opacity:.6}#snd:hover{opacity:1}
#intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,#2a1d3b,#07060a 75%);cursor:pointer;transition:opacity 1.1s,visibility 1.1s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro .crown{font-size:60px;line-height:1;color:var(--gold2);text-shadow:0 0 30px var(--gold);animation:glow 2.4s ease-in-out infinite}
#intro h2{margin:10px 0 6px;font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:clamp(28px,7vw,60px);letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(100deg,var(--gold3) 20%,var(--gold2) 45%,var(--gold) 55%,var(--gold3) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite}
#intro p{margin:18px 0 0;font-family:'Cinzel',Georgia,serif;font-size:14px;letter-spacing:.3em;color:var(--gold);animation:blink 2s ease-in-out infinite}
#lb img{max-width:94vw;max-height:90vh;border:8px solid var(--gold);border-radius:4px;box-shadow:0 0 80px rgba(232,200,114,.4)}
</style>
</head>
<body>
<div class="lights"><i></i><i></i><i></i></div><div class="floor"></div>
<canvas id="fx"></canvas>
<header>
  <h1 id="ttl">Mi hijo</h1>
  <div class="sub" id="sub">Una vida en imágenes</div>
  <div class="rule"></div>
</header>
<div id="stage"></div>
<button class="nav" id="prev" aria-label="Anterior">‹</button>
<button class="nav" id="next" aria-label="Siguiente">›</button>
<div id="cap"><div id="lab"></div><div id="txt"></div></div>
<div id="dots"></div>
<button id="play">▶ AUTO</button>
<button id="snd" title="Sonido">🔊</button>
<button id="master" title="Master">✦</button>

<aside id="panel">
  <div class="ph1"><span>MASTER</span><button class="x" id="close">×</button></div>
  <div class="pbody">
    <label>Título</label><input type="text" id="inT">
    <label>Subtítulo</label><input type="text" id="inS">
    <div style="margin:14px 0"><button class="btn" id="add">+ SUBIR FOTOS</button></div>
    <div class="hint">Sube las fotos en orden: de recién nacido hasta hoy. Con ▲ ▼ puedes reordenarlas. Se guardan en este navegador.</div>
    <div id="list"></div>
  </div>
</aside>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="fileOne" accept="image/*" hidden>
<div id="lb"><img alt=""></div>
<div id="intro"><div><div class="crown">♛</div><h2 id="introT">Mi hijo</h2><p>TOCA PARA COMENZAR ✦</p></div></div>

<script>
const $=s=>document.querySelector(s);
let samples=false,photos=[],idx=0,meta={t:'Mi hijo',s:'Una vida en imágenes'},auto=false,timer=null,replaceId=null;

/* ---------- almacenamiento (IndexedDB, con respaldo en memoria) ---------- */
let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('pasarela',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function dbGet(k){return new Promise(res=>{if(!db)return res(null);try{const q=db.transaction('k').objectStore('k').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})}
function dbSet(k,v){return new Promise(res=>{if(!db)return res();try{const t=db.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
const save=()=>dbSet('data',{photos:samples?[]:photos,meta});

/* ---------- escena ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function build(){
  photos.forEach(p=>{if(!p.ar){const im=new Image();im.onload=()=>{p.ar=im.width/im.height;layout();if(!samples)save()};im.src=p.src}});
  const st=$('#stage');st.innerHTML='';
  const n=photos.length||5;
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='card';c.dataset.i=i;
    const p=photos[i];
    c.innerHTML='<span class="gem">✦</span><div class="inner">'+(p?'<img class="bg" src="'+p.src+'" alt=""><img src="'+p.src+'" alt="'+esc(p.label)+'">':'<div class="ph"><b>✦</b>TU PRIMERA FOTO<br>AQUÍ</div>')+'</div>';
    c.onclick=()=>{if(i===idx){if(p){$('#lb img').src=p.src;$('#lb').classList.add('open')}}else go(i)};
    st.appendChild(c);
  }
  const d=$('#dots');d.innerHTML='';
  for(let i=0;i<n;i++){const e=document.createElement('i');e.onclick=()=>go(i);d.appendChild(e)}
  layout();
}
function layout(){
  const n=photos.length||5;
  idx=Math.max(0,Math.min(idx,n-1));
  const cs=[...document.querySelectorAll('.card')],stH=$('#stage').clientHeight,maxH=Math.min(stH*.9,500),maxW=Math.min(innerWidth*.74,700),k=innerWidth<600?.65:1.1;
  const S=cs.map((c,i)=>{const p=photos[i],ar=(p&&p.ar)||.75,ih=Math.min(maxH-18,(maxW-18)/ar),iw=ih*ar;return {w:iw+18,h:ih+18}});
  const X=[];X[idx]=0;
  for(let i=idx+1;i<cs.length;i++)X[i]=X[i-1]+k*(S[i-1].w*(i-1===idx?1.06:.88)+S[i].w*.88)/2;
  for(let i=idx-1;i>=0;i--)X[i]=X[i+1]-k*(S[i+1].w*(i+1===idx?1.06:.88)+S[i].w*.88)/2;
  cs.forEach((c,i)=>{
    const o=i-idx,a=Math.abs(o);
    c.style.aspectRatio='auto';c.style.width=S[i].w+'px';c.style.height=S[i].h+'px';c.style.margin=(-S[i].h/2)+'px 0 0 '+(-S[i].w/2)+'px';
    c.style.transform='translateX('+X[i]+'px) translateZ('+(-a*140)+'px) rotateY('+(-Math.sign(o)*Math.min(a,2)*38)+'deg) scale('+(o===0?1.06:.88)+')';
    c.style.opacity=a>3?0:(1-a*.2);
    c.style.filter=o===0?'none':'brightness('+(.6-a*.08)+')';
    c.style.zIndex=100-a;c.style.pointerEvents=a>3?'none':'auto';
    c.classList.toggle('on',o===0);
  });
  document.querySelectorAll('#dots i').forEach((e,i)=>e.classList.toggle('on',i===idx));
  const p=photos[idx];
  $('#lab').textContent=p?p.label:'Bienvenido';
  $('#txt').textContent=p?p.cap:'Pulsa ✦ abajo a la derecha para subir las fotos';
}
function go(i){const n=photos.length||5;idx=(i+n)%n;layout();burst()}
$('#next').onclick=()=>go(idx+1);$('#prev').onclick=()=>go(idx-1);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);if(e.key==='Escape'){$('#lb').classList.remove('open');$('#panel').classList.remove('open')}});
addEventListener('resize',layout);
let sx=null;
$('#stage').addEventListener('pointerdown',e=>{sx=e.clientX});
addEventListener('pointerup',e=>{if(sx===null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>50)go(idx+(d<0?1:-1))});
$('#lb').onclick=()=>$('#lb').classList.remove('open');
$('#play').onclick=()=>{auto=!auto;$('#play').textContent=auto?'❚❚ AUTO':'▶ AUTO';clearInterval(timer);if(auto)timer=setInterval(()=>go(idx+1),3800)};

/* ---------- panel master ---------- */
function renderList(){
  $('#inT').value=meta.t;$('#inS').value=meta.s;
  const L=$('#list');L.innerHTML='';if(samples){L.innerHTML='<div class="hint">Estas son fotos de muestra para que veas el efecto (verticales y horizontales). Al subir las tuyas, se reemplazan.</div>';return}
  photos.forEach((p,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<img src="'+p.src+'" alt=""><div><input type="text" value="'+esc(p.label)+'" placeholder="Etiqueta (ej. Recién nacido)"><input type="text" value="'+esc(p.cap)+'" placeholder="Frase corta (opcional)" style="margin-top:5px"><div class="acts"><button data-a="up">▲</button><button data-a="dn">▼</button><button data-a="rep">Cambiar</button><button data-a="del">Borrar</button></div></div>';
    const [a,b]=r.querySelectorAll('input');
    a.oninput=()=>{p.label=a.value;layout();save()};
    b.oninput=()=>{p.cap=b.value;layout();save()};
    r.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{
      const k=bt.dataset.a;
      if(k==='up'&&i>0){[photos[i-1],photos[i]]=[photos[i],photos[i-1]];idx=i-1}
      if(k==='dn'&&i<photos.length-1){[photos[i+1],photos[i]]=[photos[i],photos[i+1]];idx=i+1}
      if(k==='del'&&confirm('¿Borrar esta foto?')){photos.splice(i,1)}
      if(k==='rep'){replaceId=p.id;$('#fileOne').click();return}
      save();build();renderList();
    });
    L.appendChild(r);
  });
}
$('#master').onclick=()=>{renderList();$('#panel').classList.add('open')};
$('#close').onclick=()=>$('#panel').classList.remove('open');
$('#inT').oninput=e=>{meta.t=e.target.value;$('#ttl').textContent=meta.t||' ';save()};
$('#inS').oninput=e=>{meta.s=e.target.value;$('#sub').textContent=meta.s;save()};
$('#add').onclick=()=>$('#file').click();

function shrink(file){return new Promise(res=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.86))};
  im.onerror=()=>res(null);im.src=u})}
$('#file').onchange=async e=>{
  if(samples){photos=[];samples=false;idx=0}
  const first=photos.length;
  for(const f of e.target.files){const s=await shrink(f);if(s)photos.push({id:Date.now()+Math.random(),src:s,label:'Foto '+(photos.length+1),cap:''})}
  e.target.value='';idx=Math.min(first,photos.length-1);
  await save();build();renderList();burst();
};
$('#fileOne').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const s=await shrink(f),p=photos.find(x=>x.id===replaceId);
  if(s&&p){p.src=s;await save();build();renderList();burst()}
};

/* ---------- destellos ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let W,H,ps=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener('resize',size);
function star(x,y,r,a,col){cx.save();cx.translate(x,y);cx.globalAlpha=a;cx.fillStyle=col;cx.shadowColor=col;cx.shadowBlur=r*3;cx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.28:r,t=i*Math.PI/4;cx.lineTo(Math.cos(t)*rr,Math.sin(t)*rr)}cx.closePath();cx.fill();cx.restore()}
function add(x,y,v,l){ps.push({x,y,vx:(Math.random()-.5)*v,vy:(Math.random()-.5)*v-(v>1?.4:-.15),r:Math.random()*5+2,life:0,max:l||(150+Math.random()*200),tw:Math.random()*6})}
for(let i=0;i<70;i++){add(Math.random()*innerWidth,Math.random()*innerHeight,.3);ps[i].life=Math.random()*150}
function burst(){const s=$('.card.on');if(!s)return;const b=s.getBoundingClientRect();for(let i=0;i<40;i++)add(b.left+Math.random()*b.width,b.top+Math.random()*b.height,5,70)}
addEventListener('pointermove',e=>{if(Math.random()<.5)add(e.clientX,e.clientY,1.6,45)});
(function loop(){
  cx.clearRect(0,0,W,H);
  if(ps.length<90&&Math.random()<.2)add(Math.random()*W,Math.random()*H,.3);
  ps=ps.filter(p=>p.life<p.max);
  for(const p of ps){p.life++;p.x+=p.vx;p.y+=p.vy;const f=p.life/p.max,a=Math.sin(f*Math.PI)*(.55+.45*Math.sin(p.life*.12+p.tw));star(p.x,p.y,p.r,Math.max(a,0),f%.3<.15?'#fff1c1':'#e8c872')}
  requestAnimationFrame(loop);
})();
